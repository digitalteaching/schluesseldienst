      var h=new TextDecoder().decode(buf);
      document.open();document.write(h);document.close();
    });
  }
  function ask(msg){f.hidden=false;b.disabled=false;b.textContent='Aufschließen';m.textContent=msg||'';p.focus()}
  if(!window.crypto||!crypto.subtle){f.hidden=false;b.disabled=true;m.textContent='Dieser Browser kann die Seite nicht öffnen. Bitte nutzt einen aktuellen Browser (Chrome, Edge, Firefox, Safari).';return}
  f.addEventListener('submit',function(e){
    e.preventDefault();var pw=p.value.trim();if(!pw)return;
    b.disabled=true;b.textContent='Wird aufgeschlossen …';m.textContent='';
    open(pw).catch(function(){p.value='';ask('Das Passwort stimmt nicht. Versucht es noch einmal.')});
  });
  // Ein gemerktes Passwort öffnet die Seite direkt. Passt es nicht mehr, wird neu gefragt.
  var saved=get();
  if(saved){open(saved).catch(function(){ask()})}else{ask()}
})();
</script>
</body>
</html>
